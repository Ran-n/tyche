<!DOCTYPE html>
<!--

  Created:  2026/05/19
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tyche</title>
  <link rel="icon" href="favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080810;
      color: #fff;
      font-family: system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #app {
      width: 100%;
      max-width: 780px;
      padding: 0 32px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    /* ── header ── */
    header {
      text-align: center;
      padding: 40px 0 4px;
    }
    header h1 {
      font-size: 48px;
      font-weight: 800;
      color: #6d59f0;
      letter-spacing: 8px;
    }
    #subtitle {
      font-size: 12px;
      color: #383858;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* ── language switcher ── */
    #lang-switcher {
      position: fixed;
      top: 14px;
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      z-index: 100;
    }
    .flag-btn {
      background: #0f0f1e;
      border: 1px solid #222240;
      border-radius: 6px;
      padding: 5px 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: background 120ms ease-out;
    }
    .flag-btn:hover { background: #16162a; }
    .flag-btn svg { width: 26px; height: 17px; display: block; }
    #lang-dropdown {
      background: #0a0a18;
      border: 1px solid #222240;
      border-radius: 8px;
      padding: 4px;
      display: none;
      flex-direction: column;
      gap: 4px;
    }
    #lang-dropdown.open { display: flex; }
    .lang-option {
      background: transparent;
      border: none;
      border-radius: 5px;
      padding: 4px 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: background 120ms ease-out;
    }
    .lang-option:hover { background: #14142a; }
    .lang-option svg { width: 26px; height: 17px; display: block; }

    /* ── controls card ── */
    #controls-card {
      background: #09091a;
      border: 1px solid #14142a;
      border-radius: 16px;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }
    #inputs-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      align-items: flex-end;
    }
    .field-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 120px;
    }
    .field-wrap label {
      font-size: 13px;
      color: #7c6af7;
      font-weight: 500;
      text-align: center;
    }
    .field-wrap input[type="number"] {
      background: transparent;
      border: none;
      border-bottom: 1px solid #2a2a45;
      color: #fff;
      font-size: 24px;
      text-align: center;
      padding: 4px 0 6px;
      outline: none;
      font-family: 'Courier New', monospace;
      width: 100%;
      -moz-appearance: textfield;
    }
    .field-wrap input[type="number"]::-webkit-inner-spin-button,
    .field-wrap input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .field-wrap input[type="number"]:focus { border-bottom-color: #a78bfa; }

    /* toggle */
    .toggle-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .toggle-wrap label {
      font-size: 13px;
      color: #7c6af7;
      font-weight: 500;
    }
    .switch {
      position: relative;
      width: 48px;
      height: 26px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #1a1a30;
      border-radius: 26px;
      cursor: pointer;
      transition: background 200ms;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 4px;
      top: 4px;
      border-radius: 50%;
      background: #2a2a45;
      transition: transform 200ms, background 200ms;
    }
    .switch input:checked + .slider { background: #5b48e033; }
    .switch input:checked + .slider::before {
      transform: translateX(22px);
      background: #a78bfa;
    }

    /* buttons */
    #buttons-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 150ms, filter 150ms;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn:active { filter: brightness(0.9); }
    #draw-btn {
      background: #5b48e0;
      color: #fff;
      padding: 16px 36px;
    }
    #clear-btn {
      background: #0d0d1a;
      color: #555577;
      padding: 16px 28px;
      border: 1px solid #222240;
    }
    .btn svg { width: 16px; height: 16px; }

    #error-text {
      color: #f87171;
      font-size: 12px;
      text-align: center;
      display: none;
    }

    /* ── result area ── */
    #result-area {
      background: #07070f;
      border: 1px solid #14142a;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 180px;
    }
    #hint-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #hint-icon {
      width: 52px;
      height: 52px;
      color: #1c1c35;
      fill: #1c1c35;
    }
    #hint-text {
      color: #2a2a45;
      font-size: 13px;
      text-align: center;
    }
    #chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
    }
    .chip-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .chip-rank {
      font-size: 10px;
      font-weight: 600;
      font-family: 'Courier New', monospace;
      text-align: center;
    }
    .chip-box {
      width: 86px;
      height: 86px;
      border-radius: 20px;
      background: #0a0a18;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      color: #fff;
      border: 1.5px solid;
      animation: pop 250ms ease-out;
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<div id="lang-switcher">
  <button class="flag-btn" id="lang-current" aria-label="Language" title="EN">
    <!-- replaced by JS -->
  </button>
  <div id="lang-dropdown"></div>
</div>

<div id="app">
  <header>
    <h1>TYCHE</h1>
    <div id="subtitle"></div>
  </header>

  <div id="controls-card">
    <div id="inputs-row">
      <div class="field-wrap">
        <label id="label-n" for="field-n"></label>
        <input id="field-n" type="number" value="6" min="1">
      </div>
      <div class="field-wrap">
        <label id="label-m" for="field-m"></label>
        <input id="field-m" type="number" value="10" min="1">
      </div>
      <div class="toggle-wrap">
        <label id="label-rep" for="rep-toggle"></label>
        <label class="switch">
          <input id="rep-toggle" type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div id="buttons-row">
      <button class="btn" id="draw-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2m2 3a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m10 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M12 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M7 15.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m10 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3"/></svg>
        <span id="draw-label"></span>
      </button>
      <button class="btn" id="clear-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        <span id="clear-label"></span>
      </button>
    </div>
    <div id="error-text"></div>
  </div>

  <div id="result-area">
    <div id="hint-col">
      <svg id="hint-icon" viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2m2 3a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m10 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M12 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M7 15.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m10 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3"/></svg>
      <div id="hint-text"></div>
    </div>
    <div id="chips-wrap" style="display:none"></div>
  </div>
</div>

<script>
const STRINGS = {
  en: {
    subtitle: "random number selector",
    pick_n: "quantity", from_m: "total", replacement: "replacement",
    draw: "Draw", clear: "Clear",
    hint: "press Draw to pick numbers",
    err_int: "N and M must be whole numbers.",
    err_zero: "N and M must be greater than zero.",
    err_range: "Can’t pick {n} unique numbers from 1…{m}.",
  },
  es: {
    subtitle: "selector de números aleatorios",
    pick_n: "cantidad", from_m: "total", replacement: "repetición",
    draw: "Sortear", clear: "Limpiar",
    hint: "pulsa Sortear para elegir números",
    err_int: "N y M deben ser números enteros.",
    err_zero: "N y M deben ser mayores que cero.",
    err_range: "No se pueden elegir {n} números únicos del 1…{m}.",
  },
  gl: {
    subtitle: "selector de números aleatorios",
    pick_n: "cantidade", from_m: "total", replacement: "repetición",
    draw: "Sortear", clear: "Limpar",
    hint: "preme Sortear para escoller números",
    err_int: "N e M deben ser números enteiros.",
    err_zero: "N e M deben ser maiores que cero.",
    err_range: "Non se poden escoller {n} números únicos do 1…{m}.",
  },
  eo: {
    subtitle: "hazarda nombro-elektilo",
    pick_n: "kvanto", from_m: "totalo", replacement: "ripeto",
    draw: "Tiri", clear: "Forigi",
    hint: "premu Tiri por elekti nombrojn",
    err_int: "N kaj M devas esti entjeroj.",
    err_zero: "N kaj M devas esti pli grandaj ol nulo.",
    err_range: "Ne eblas elekti {n} unikajn nombrojn el 1…{m}.",
  },
};

const FLAGS = {
  en: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40"><rect width="60" height="40" fill="#fff"/><rect x="24" y="0" width="12" height="40" fill="#CE1124"/><rect x="0" y="14" width="60" height="12" fill="#CE1124"/></svg>`,
  gl: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40"><rect width="60" height="40" fill="#fff"/><polygon points="0,0 18,0 60,40 42,40" fill="#009BDE"/></svg>`,
  es: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40"><rect width="60" height="40" fill="#c60b1e"/><rect y="13.33" width="60" height="13.34" fill="#FFCC00"/><rect y="26.67" width="60" height="13.33" fill="#c60b1e"/></svg>`,
  eo: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40"><rect width="60" height="40" fill="#009900"/><rect width="20" height="13.33" fill="#ffffff"/><polygon fill="#009900" points="10,1.87 10.93,4.8 14,4.8 11.53,6.53 12.47,9.47 10,7.73 7.53,9.47 8.47,6.53 6,4.8 9.07,4.8" /></svg>`,
};

const LANG_ORDER = ['en', 'gl', 'es', 'eo'];

const COLORS = [
  '#818cf8','#a78bfa','#e879f9','#38bdf8',
  '#34d399','#fb923c','#f472b6','#facc15',
  '#ef4444','#22d3ee',
];

let lang = 'en';
let selected = [];

function t(key, vars = {}) {
  let s = STRINGS[lang][key];
  return s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
}

function applyLang() {
  document.documentElement.lang = lang;
  document.getElementById('subtitle').textContent = t('subtitle');
  document.getElementById('label-n').textContent = t('pick_n');
  document.getElementById('label-m').textContent = t('from_m');
  document.getElementById('label-rep').textContent = t('replacement');
  document.getElementById('draw-label').textContent = t('draw');
  document.getElementById('clear-label').textContent = t('clear');
  document.getElementById('hint-text').textContent = t('hint');
  document.getElementById('lang-current').title = lang.toUpperCase();
  document.getElementById('lang-current').innerHTML = FLAGS[lang];
  hideError();
  renderDropdown();
}

function renderDropdown() {
  const dd = document.getElementById('lang-dropdown');
  dd.innerHTML = '';
  LANG_ORDER.filter(c => c !== lang).forEach(code => {
    const btn = document.createElement('button');
    btn.className = 'lang-option';
    btn.title = code.toUpperCase();
    btn.innerHTML = FLAGS[code];
    btn.addEventListener('click', () => selectLang(code));
    dd.appendChild(btn);
  });
}

function selectLang(code) {
  lang = code;
  closeDropdown();
  applyLang();
}

let dropdownOpen = false;
function toggleDropdown() {
  dropdownOpen = !dropdownOpen;
  document.getElementById('lang-dropdown').classList.toggle('open', dropdownOpen);
}
function closeDropdown() {
  dropdownOpen = false;
  document.getElementById('lang-dropdown').classList.remove('open');
}

document.getElementById('lang-current').addEventListener('click', toggleDropdown);
document.addEventListener('click', e => {
  if (!document.getElementById('lang-switcher').contains(e.target)) closeDropdown();
});

function showError(msg) {
  const el = document.getElementById('error-text');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('error-text').style.display = 'none';
}

function buildChip(number, idx) {
  const color = COLORS[idx % COLORS.length];
  const col = document.createElement('div');
  col.className = 'chip-col';
  const rank = document.createElement('div');
  rank.className = 'chip-rank';
  rank.style.color = color + '99';
  rank.textContent = `#${idx + 1}`;
  const box = document.createElement('div');
  box.className = 'chip-box';
  box.style.borderColor = color + '88';
  box.style.boxShadow = `0 4px 24px 0 ${color}33`;
  box.textContent = number;
  col.appendChild(rank);
  col.appendChild(box);
  return col;
}

function renderResults() {
  const hint = document.getElementById('hint-col');
  const chips = document.getElementById('chips-wrap');
  if (selected.length === 0) {
    hint.style.display = 'flex';
    chips.style.display = 'none';
    chips.innerHTML = '';
  } else {
    hint.style.display = 'none';
    chips.style.display = 'flex';
    chips.innerHTML = '';
    selected.forEach((n, i) => chips.appendChild(buildChip(n, i)));
  }
}

function onDraw() {
  hideError();
  const nRaw = document.getElementById('field-n').value;
  const mRaw = document.getElementById('field-m').value;
  const n = parseInt(nRaw, 10);
  const m = parseInt(mRaw, 10);
  if (!Number.isInteger(n) || !Number.isInteger(m) || nRaw === '' || mRaw === '') {
    showError(t('err_int')); return;
  }
  if (n <= 0 || m <= 0) { showError(t('err_zero')); return; }
  const withReplacement = document.getElementById('rep-toggle').checked;
  if (!withReplacement && n > m) { showError(t('err_range', {n, m})); return; }

  const pool = Array.from({length: m}, (_, i) => i + 1);
  if (withReplacement) {
    selected = Array.from({length: n}, () => pool[Math.floor(Math.random() * m)]);
  } else {
    // Fisher-Yates partial shuffle
    const arr = pool.slice();
    for (let i = 0; i < n; i++) {
      const j = i + Math.floor(Math.random() * (m - i));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    selected = arr.slice(0, n);
  }
  renderResults();
}

function onClear() {
  selected = [];
  hideError();
  renderResults();
}

document.getElementById('draw-btn').addEventListener('click', onDraw);
document.getElementById('clear-btn').addEventListener('click', onClear);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (dropdownOpen) closeDropdown(); else onClear(); }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement === document.getElementById('draw-btn')) return;
  if (e.key === 'Enter' && !['INPUT','BUTTON'].includes(document.activeElement.tagName)) onDraw();
});

// init
applyLang();
renderResults();
</script>
</body>
</html>
