<!DOCTYPE html>
<!--
  Authors:  Ran# <ran.hash@proton.me>
  Created:  2026/05/19
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tyche</title>
  <link rel="icon" href="favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Gruvbox palette: https://github.com/morhetz/gruvbox
       Light mode swaps Gruvbox's bg0 (a warm cream) for a neutral white
       page — full-bleed cream reads heavy at page scale — while keeping
       every accent (orange, chip colors, foreground text) authentically
       Gruvbox. Dark mode uses the palette as-is. */
    :root { color-scheme: light dark; }
    :root, :root[data-theme="light"] {
      --bg: #f7f6f4;          /* neutral, not Gruvbox */
      --bg-alt: #efeeec;      /* neutral, not Gruvbox */
      --fg: #3c3836;          /* gruvbox light fg1 */
      --fg-muted: #7c6f64;    /* gruvbox light fg4 */
      --fg-faint: #bdae93;    /* gruvbox light fg3 */
      --card-bg: #ffffff;     /* neutral, not Gruvbox */
      --card-border: #e2ddd4; /* neutral, not Gruvbox */
      --accent: #d65d0e;      /* gruvbox light orange */
      --danger: #9d0006;      /* gruvbox light faded red */
      --shadow: rgba(60, 45, 20, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #282828;          /* gruvbox dark bg0 */
        --bg-alt: #1d2021;      /* gruvbox dark bg0_h */
        --fg: #ebdbb2;          /* gruvbox dark fg1 */
        --fg-muted: #a89984;    /* gruvbox dark fg4 */
        --fg-faint: #504945;    /* gruvbox dark bg2 */
        --card-bg: #3c3836;     /* gruvbox dark bg1 */
        --card-border: #504945; /* gruvbox dark bg2 */
        --accent: #fe8019;      /* gruvbox dark bright orange */
        --danger: #fb4934;      /* gruvbox dark bright red */
        --shadow: rgba(0, 0, 0, 0.45);
      }
    }
    :root[data-theme="dark"] {
      --bg: #282828; --bg-alt: #1d2021; --fg: #ebdbb2; --fg-muted: #a89984; --fg-faint: #504945;
      --card-bg: #3c3836; --card-border: #504945; --accent: #fe8019; --danger: #fb4934;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #app {
      width: 100%;
      max-width: 780px;
      padding: 0 32px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    /* ── header ── */
    header {
      text-align: center;
      padding: 40px 0 4px;
    }
    header h1 {
      font-size: 48px;
      font-weight: 800;
      color: var(--fg);
      letter-spacing: 8px;
    }
    #subtitle {
      font-size: 12px;
      color: var(--fg-muted);
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* ── toolbar (language picker + theme toggle) ── */
    #toolbar {
      position: fixed;
      top: 14px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
    }

    .lang-picker { position: relative; }
    .lang-trigger {
      display: flex;
      align-items: center;
      gap: 6px;
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--fg);
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 600;
      transition: border-color 120ms ease-out;
    }
    .lang-trigger:hover { border-color: var(--accent); }
    .lang-trigger .flag svg { width: 22px; height: 15px; display: block; }
    .lang-trigger .chevron { color: var(--fg-muted); font-size: 9px; }

    #lang-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      margin: 0;
      padding: 4px;
      list-style: none;
      width: 9.5rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      box-shadow: 0 8px 24px var(--shadow);
    }
    #lang-menu[hidden] { display: none; }
    .lang-option {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      font: inherit;
      text-align: left;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: var(--fg);
      padding: 6px 7px;
      font-size: 12px;
      transition: background 120ms ease-out;
    }
    .lang-option:hover { background: var(--bg-alt); }
    .lang-option[aria-selected="true"] { font-weight: 700; color: var(--accent); }
    .lang-option svg { width: 22px; height: 15px; display: block; }

    .theme-btn {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--fg-muted);
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: border-color 120ms ease-out;
    }
    .theme-btn:hover { border-color: var(--accent); }

    /* ── controls card ── */
    #controls-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      box-shadow: 0 2px 10px var(--shadow);
    }
    #inputs-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      align-items: flex-end;
    }
    .field-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 120px;
    }
    .field-wrap label {
      font-size: 13px;
      color: var(--fg-muted);
      font-weight: 500;
      text-align: center;
    }
    .field-wrap input[type="number"] {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--card-border);
      color: var(--fg);
      font-size: 24px;
      text-align: center;
      padding: 4px 0 6px;
      outline: none;
      font-family: 'Courier New', monospace;
      width: 100%;
      -moz-appearance: textfield;
    }
    .field-wrap input[type="number"]::-webkit-inner-spin-button,
    .field-wrap input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .field-wrap input[type="number"]:focus { border-bottom-color: var(--accent); }

    /* toggle */
    .toggle-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .toggle-wrap label {
      font-size: 13px;
      color: var(--fg-muted);
      font-weight: 500;
    }
    .switch {
      position: relative;
      width: 48px;
      height: 26px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: var(--bg-alt);
      border: 1px solid var(--card-border);
      border-radius: 26px;
      cursor: pointer;
      transition: background 200ms;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: var(--fg-faint);
      transition: transform 200ms, background 200ms;
    }
    .switch input:checked + .slider { border-color: var(--accent); }
    .switch input:checked + .slider::before {
      transform: translateX(22px);
      background: var(--accent);
    }

    /* buttons */
    #buttons-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 150ms, filter 150ms;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn:active { filter: brightness(0.9); }
    #draw-btn {
      background: var(--accent);
      color: var(--fg);
      padding: 16px 36px;
    }
    #clear-btn {
      background: transparent;
      color: var(--fg-muted);
      padding: 16px 28px;
      border: 1px solid var(--card-border);
    }
    .btn svg { width: 16px; height: 16px; }

    #error-text {
      color: var(--danger);
      font-size: 12px;
      text-align: center;
      display: none;
    }

    /* ── result area ── */
    #result-area {
      background: var(--bg-alt);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 180px;
    }
    #hint-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #hint-icon {
      width: 52px;
      height: 52px;
      color: var(--fg-faint);
      fill: var(--fg-faint);
    }
    #hint-text {
      color: var(--fg-muted);
      font-size: 13px;
      text-align: center;
    }
    #chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
    }
    .chip-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .chip-rank {
      font-size: 10px;
      font-weight: 600;
      font-family: 'Courier New', monospace;
      text-align: center;
    }
    .chip-box {
      width: 86px;
      height: 86px;
      border-radius: 20px;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      color: var(--fg);
      border: 1.5px solid;
      animation: pop 250ms ease-out;
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<div id="toolbar">
  <div class="lang-picker">
    <button class="lang-trigger" id="lang-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span class="flag" id="lang-trigger-flag"></span>
      <span id="lang-trigger-name"></span>
      <span class="chevron">▾</span>
    </button>
    <ul id="lang-menu" role="listbox" hidden></ul>
  </div>
  <button class="theme-btn" id="theme-toggle" type="button"></button>
</div>

<div id="app">
  <header>
    <h1>TYCHE</h1>
    <div id="subtitle"></div>
  </header>

  <div id="controls-card">
    <div id="inputs-row">
      <div class="field-wrap">
        <label id="label-n" for="field-n"></label>
        <input id="field-n" type="number" min="1">
      </div>
      <div class="field-wrap">
        <label id="label-m" for="field-m"></label>
        <input id="field-m" type="number" min="1">
      </div>
      <div class="toggle-wrap">
        <label id="label-rep" for="rep-toggle"></label>
        <label class="switch">
          <input id="rep-toggle" type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div id="buttons-row">
      <button class="btn" id="draw-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2m2 3a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m10 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M12 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M7 15.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m10 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3"/></svg>
        <span id="draw-label"></span>
      </button>
      <button class="btn" id="clear-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        <span id="clear-label"></span>
      </button>
    </div>
    <div id="error-text"></div>
  </div>

  <div id="result-area">
    <div id="hint-col">
      <svg id="hint-icon" viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2m2 3a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m10 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M12 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M7 15.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m10 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3"/></svg>
      <div id="hint-text"></div>
    </div>
    <div id="chips-wrap" style="display:none"></div>
  </div>
</div>

<script>
const STRINGS = {
  en: {
    subtitle: "random number selector",
    pick_n: "quantity", from_m: "total", replacement: "replacement",
    draw: "Draw", clear: "Clear",
    hint: "press Draw to pick numbers",
    err_int: "N and M must be whole numbers.",
    err_zero: "N and M must be greater than zero.",
    err_range: "Can’t pick {n} unique numbers from 1…{m}.",
    themeToLight: "Switch to light mode",
    themeToDark: "Switch to dark mode",
  },
  es: {
    subtitle: "selector de números aleatorios",
    pick_n: "cantidad", from_m: "total", replacement: "repetición",
    draw: "Sortear", clear: "Limpiar",
    hint: "pulsa Sortear para elegir números",
    err_int: "N y M deben ser números enteros.",
    err_zero: "N y M deben ser mayores que cero.",
    err_range: "No se pueden elegir {n} números únicos del 1…{m}.",
    themeToLight: "Cambiar a modo claro",
    themeToDark: "Cambiar a modo oscuro",
  },
  gl: {
    subtitle: "selector de números aleatorios",
    pick_n: "cantidade", from_m: "total", replacement: "repetición",
    draw: "Sortear", clear: "Limpar",
    hint: "preme Sortear para escoller números",
    err_int: "N e M deben ser números enteiros.",
    err_zero: "N e M deben ser maiores que cero.",
    err_range: "Non se poden escoller {n} números únicos do 1…{m}.",
    themeToLight: "Cambiar a modo claro",
    themeToDark: "Cambiar a modo escuro",
  },
  eo: {
    subtitle: "hazarda nombro-elektilo",
    pick_n: "kvanto", from_m: "totalo", replacement: "ripeto",
    draw: "Tiri", clear: "Forigi",
    hint: "premu Tiri por elekti nombrojn",
    err_int: "N kaj M devas esti entjeroj.",
    err_zero: "N kaj M devas esti pli grandaj ol nulo.",
    err_range: "Ne eblas elekti {n} unikajn nombrojn el 1…{m}.",
    themeToLight: "Ŝanĝi al luma reĝimo",
    themeToDark: "Ŝanĝi al malluma reĝimo",
  },
};

const FLAG_EN = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40"><rect width="60" height="40" fill="#fff"/><rect x="24" y="0" width="12" height="40" fill="#CE1124"/><rect x="0" y="14" width="60" height="12" fill="#CE1124"/></svg>`;
const FLAG_GL = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40"><rect width="60" height="40" fill="#fff"/><polygon points="0,0 18,0 60,40 42,40" fill="#009BDE"/></svg>`;
const FLAG_ES = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40"><rect width="60" height="40" fill="#c60b1e"/><rect y="13.33" width="60" height="13.34" fill="#FFCC00"/><rect y="26.67" width="60" height="13.33" fill="#c60b1e"/></svg>`;
const FLAG_EO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40"><rect width="60" height="40" fill="#009900"/><rect width="20" height="13.33" fill="#ffffff"/><polygon fill="#009900" points="10,1.87 10.93,4.8 14,4.8 11.53,6.53 12.47,9.47 10,7.73 7.53,9.47 8.47,6.53 6,4.8 9.07,4.8" /></svg>`;

// Ordered as they appear in the language menu.
const LANGUAGES = [
  { code: 'en', flag: FLAG_EN, name: 'English' },
  { code: 'gl', flag: FLAG_GL, name: 'Galego' },
  { code: 'es', flag: FLAG_ES, name: 'Español' },
  { code: 'eo', flag: FLAG_EO, name: 'Esperanto' },
];
const SUPPORTED_LANGS = LANGUAGES.map(l => l.code);
const LANG_BY_CODE = {};
LANGUAGES.forEach(l => LANG_BY_CODE[l.code] = l);

// Gruvbox's own light/dark swatches: faded tones read on the cream bg0,
// bright tones read on the near-black bg0 — using bright on both made
// light mode feel drenched in yellow/orange.
const COLORS_LIGHT = [
  '#9d0006', '#af3a03', '#b57614', '#79740e',
  '#427b58', '#076678', '#8f3f71', '#d65d0e',
];
const COLORS_DARK = [
  '#fb4934', '#fe8019', '#fabd2f', '#b8bb26',
  '#8ec07c', '#83a598', '#d3869b', '#d65d0e',
];
function chipColors() {
  return effectiveTheme() === 'dark' ? COLORS_DARK : COLORS_LIGHT;
}

function detectLang() {
  const stored = localStorage.getItem('lang');
  if (stored && SUPPORTED_LANGS.includes(stored)) return stored;
  const candidates = navigator.languages || [navigator.language || 'en'];
  for (const c of candidates) {
    const code = (c || '').slice(0, 2).toLowerCase();
    if (SUPPORTED_LANGS.includes(code)) return code;
  }
  return 'en';
}

let lang = detectLang();
let selected = [];

function t(key, vars = {}) {
  let s = STRINGS[lang][key];
  return s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
}

function applyLang() {
  document.documentElement.lang = lang;
  document.getElementById('subtitle').textContent = t('subtitle');
  document.getElementById('label-n').textContent = t('pick_n');
  document.getElementById('label-m').textContent = t('from_m');
  document.getElementById('label-rep').textContent = t('replacement');
  document.getElementById('draw-label').textContent = t('draw');
  document.getElementById('clear-label').textContent = t('clear');
  document.getElementById('hint-text').textContent = t('hint');
  hideError();
  applyTheme(effectiveTheme());
  updateLangTrigger();
}

/* ── theme ── */
function effectiveTheme() {
  const stored = localStorage.getItem('theme');
  if (stored) return stored;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-toggle');
  btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  btn.setAttribute('aria-label', theme === 'dark' ? t('themeToLight') : t('themeToDark'));
  btn.title = btn.getAttribute('aria-label');
}

document.getElementById('theme-toggle').addEventListener('click', () => {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
  renderResults();
});

/* ── language picker ── */
const langTrigger = document.getElementById('lang-trigger');
const langMenu = document.getElementById('lang-menu');
const langTriggerFlag = document.getElementById('lang-trigger-flag');
const langTriggerName = document.getElementById('lang-trigger-name');
let langMenuOpen = false;

LANGUAGES.forEach(l => {
  const li = document.createElement('li');
  li.setAttribute('role', 'presentation');
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'lang-option';
  btn.setAttribute('role', 'option');
  btn.innerHTML = `<span class="flag">${l.flag}</span><span>${l.name}</span>`;
  btn.addEventListener('click', () => {
    lang = l.code;
    localStorage.setItem('lang', l.code);
    closeLangMenu();
    applyLang();
  });
  li.appendChild(btn);
  langMenu.appendChild(li);
});

function updateLangTrigger() {
  const l = LANG_BY_CODE[lang];
  langTriggerFlag.innerHTML = l.flag;
  langTriggerName.textContent = l.name;
  Array.prototype.forEach.call(langMenu.querySelectorAll('.lang-option'), (btn, i) => {
    btn.setAttribute('aria-selected', String(LANGUAGES[i].code === lang));
  });
}

function openLangMenu() {
  langMenuOpen = true;
  langMenu.hidden = false;
  langTrigger.setAttribute('aria-expanded', 'true');
}
function closeLangMenu() {
  langMenuOpen = false;
  langMenu.hidden = true;
  langTrigger.setAttribute('aria-expanded', 'false');
}

langTrigger.addEventListener('click', () => { langMenuOpen ? closeLangMenu() : openLangMenu(); });
document.addEventListener('click', e => {
  if (langMenuOpen && !e.target.closest('.lang-picker')) closeLangMenu();
});

function showError(msg) {
  const el = document.getElementById('error-text');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('error-text').style.display = 'none';
}

function buildChip(number, idx) {
  const palette = chipColors();
  const color = palette[idx % palette.length];
  const col = document.createElement('div');
  col.className = 'chip-col';
  const rank = document.createElement('div');
  rank.className = 'chip-rank';
  rank.style.color = color;
  rank.textContent = `#${idx + 1}`;
  const box = document.createElement('div');
  box.className = 'chip-box';
  box.style.borderColor = color;
  box.style.boxShadow = `0 4px 24px 0 ${color}33`;
  box.textContent = number;
  col.appendChild(rank);
  col.appendChild(box);
  return col;
}

function renderResults() {
  const hint = document.getElementById('hint-col');
  const chips = document.getElementById('chips-wrap');
  if (selected.length === 0) {
    hint.style.display = 'flex';
    chips.style.display = 'none';
    chips.innerHTML = '';
  } else {
    hint.style.display = 'none';
    chips.style.display = 'flex';
    chips.innerHTML = '';
    selected.forEach((n, i) => chips.appendChild(buildChip(n, i)));
  }
}

function onDraw() {
  hideError();
  const nRaw = document.getElementById('field-n').value;
  const mRaw = document.getElementById('field-m').value;
  const n = parseInt(nRaw, 10);
  const m = parseInt(mRaw, 10);
  if (!Number.isInteger(n) || !Number.isInteger(m) || nRaw === '' || mRaw === '') {
    showError(t('err_int')); return;
  }
  if (n <= 0 || m <= 0) { showError(t('err_zero')); return; }
  const withReplacement = document.getElementById('rep-toggle').checked;
  if (!withReplacement && n > m) { showError(t('err_range', {n, m})); return; }

  localStorage.setItem('n', n);
  localStorage.setItem('m', m);
  localStorage.setItem('replacement', withReplacement);

  const pool = Array.from({length: m}, (_, i) => i + 1);
  if (withReplacement) {
    selected = Array.from({length: n}, () => pool[Math.floor(Math.random() * m)]);
  } else {
    // Fisher-Yates partial shuffle
    const arr = pool.slice();
    for (let i = 0; i < n; i++) {
      const j = i + Math.floor(Math.random() * (m - i));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    selected = arr.slice(0, n);
  }
  renderResults();
}

function onClear() {
  selected = [];
  hideError();
  renderResults();
}

document.getElementById('draw-btn').addEventListener('click', onDraw);
document.getElementById('clear-btn').addEventListener('click', onClear);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (langMenuOpen) closeLangMenu(); else onClear(); }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement === document.getElementById('draw-btn')) return;
  if (e.key === 'Enter' && !['INPUT','BUTTON'].includes(document.activeElement.tagName)) onDraw();
});

// init
document.getElementById('field-n').value = localStorage.getItem('n') || '6';
document.getElementById('field-m').value = localStorage.getItem('m') || '10';
document.getElementById('rep-toggle').checked = localStorage.getItem('replacement') === 'true';
applyLang();
renderResults();
</script>
</body>
</html>
